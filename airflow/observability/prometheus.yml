global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: airflow
    static_configs:
      - targets: ["statsd-exporter:9102"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
