[project]
name = "ghcn-elt"
version = "0.1.0"
description = "Daily ELT over NOAA GHCN-Daily: Airflow extracts to bronze, dbt builds the warehouse, tests gate the run."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Tajaddin Gafarov", email = "gafarovtajaddin@gmail.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.5,<2",
    "pyarrow>=21,<23",
    "httpx>=0.28,<1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "structlog>=25.4,<26",
    "typer>=0.17,<1",
    "opentelemetry-sdk>=1.36,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.36,<2",
]

[project.optional-dependencies]
dbt = [
    "dbt-core>=1.12,<1.13",
    "dbt-duckdb>=1.11,<1.12",
]
dev = [
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<7",
    "ruff>=0.13,<1",
    "mypy>=1.17,<2",
    "pre-commit>=4.3,<5",
]

[project.scripts]
ghcn-elt = "ghcn_elt.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghcn_elt"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "PL", "RUF"]
ignore = ["S101", "PLR2004", "S608", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "E501"]
"airflow/tests/**" = ["S", "PLR", "E501", "PLC0415"]
# Airflow tasks import inside the function on purpose: the dag-processor parses files constantly.
"airflow/dags/**" = ["PLC0415"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ghcn_elt"]
mypy_path = "src"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider --strict-markers"
markers = [
    "network: talks to NOAA's public bucket (skipped unless -m network)",
    "slow: takes more than a few seconds",
]

[tool.coverage.run]
source = ["ghcn_elt"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
