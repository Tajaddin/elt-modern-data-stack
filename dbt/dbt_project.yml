name: ghcn_warehouse
version: "0.1.0"
config-version: 2
profile: ghcn_warehouse

model-paths: ["models"]
test-paths: ["tests"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
analysis-paths: ["analyses"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

flags:
  send_anonymous_usage_stats: false
  require_explicit_package_overrides_for_builtin_materializations: true

vars:
  # Days re-merged on every incremental run; matches GHCN_LOOKBACK_DAYS in the extractor.
  lookback_days: 14
  # Days an incremental build of fct_station_day rebuilds, inclusive. A run that knows which days it
  # loaded sets them (the Airflow DAG passes its extract window), so backfilled days reach the fact.
  # Unset, the build rebuilds the last lookback_days days the fact already holds.
  window_start: null
  window_end: null
  # Volume drift test: the latest run's row count must be within this factor of the median of previous runs.
  volume_band_factor: 3

models:
  ghcn_warehouse:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

snapshots:
  ghcn_warehouse:
    +schema: snapshots

tests:
  ghcn_warehouse:
    +store_failures: true
    +schema: dbt_test_failures
