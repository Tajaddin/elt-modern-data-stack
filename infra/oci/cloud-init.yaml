#cloud-config
# First boot of the Airflow VM: Docker, compose plugin, a swap file, unattended security updates,
# fail2ban for SSH, and the directory the deploy workflow syncs into. The host firewall is opened for
# 80/443 (Oracle's Ubuntu images ship iptables rules that block them even when the security list allows them).
package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - gnupg
  - fail2ban
  - unattended-upgrades
  - rsync

write_files:
  - path: /etc/apt/apt.conf.d/52unattended-upgrades-local
    content: |
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "04:30";
  - path: /etc/sysctl.d/60-ghcn.conf
    content: |
      vm.swappiness = 10
      vm.max_map_count = 262144

runcmd:
  # Docker from the official repository
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - sh -c 'echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" > /etc/apt/sources.list.d/docker.list'
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - usermod -aG docker ubuntu
  - systemctl enable --now docker
  # 4 GB swap: the dbt venv install and image builds spike memory
  - fallocate -l 4G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
  - sh -c 'echo "/swapfile none swap sw 0 0" >> /etc/fstab'
  - sysctl --system
  # open 80/443 in the image's own iptables rules and persist them
  - iptables -I INPUT 6 -m state --state NEW -p tcp --dport 80 -j ACCEPT
  - iptables -I INPUT 6 -m state --state NEW -p tcp --dport 443 -j ACCEPT
  - sh -c 'DEBIAN_FRONTEND=noninteractive apt-get install -y iptables-persistent && netfilter-persistent save'
  - systemctl enable --now fail2ban
  - mkdir -p /opt/ghcn/app /opt/ghcn/data && chown -R ubuntu:ubuntu /opt/ghcn
  - touch /opt/ghcn/cloud-init-done
